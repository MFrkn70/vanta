[package]
name = "vanta"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "vanta"
path = "engine/src/main.rs"

[features]
default = ["wayland"]

x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:memfd",]

[dependencies]

[dependencies.x11rb]
version = "0.14.0"
optional = true

[dependencies.wayland-client]
version = "0.31.15"
optional = true

[dependencies.wayland-protocols]
version = "0.32"
features = ["client"]
optional = true

[dependencies.memfd]
version = "0.6"
optional = true


[target.'cfg(windows)'.dependencies]
windows = {
    version = "0.62.2",
    features = [
        "Win32_Foundation",
        "Win32_System_LibraryLoader",
        "Win32_UI_WindowsAndMessaging"
    ]
}
